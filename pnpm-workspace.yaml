catalogMode: manual
blockExoticSubdeps: true
cleanupUnusedCatalogs: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@solana/*'
allowBuilds:
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: false
  utf-8-validate: true
# Security floors for transitive dev/build dependencies that their parents pin
# below the patched release (Dependabot alerts). Each override only applies to
# the vulnerable range and stays within the same major.
overrides:
  '@babel/core@<7.29.6': ^7.29.6
  axios@<1.20.0: ^1.20.0
  baseline-browser-mapping@<2.11.0: ^2.11.0
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  browserslist@<4.28.7: ^4.28.7
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  hono@<4.13.7: ^4.13.7
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  postcss-selector-parser@>=6.1.0 <6.1.3: ^6.1.3
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  undici@>=7.0.0 <7.29.1: ^7.29.1
  vite@>=7.0.0 <7.3.5: ^7.3.6
  # Parent-scoped: a bare ws@7 selector also rewrites isows' `ws: "*"` peer
  '@walletconnect/jsonrpc-ws-connection>ws': ^7.5.11
  ws@>=8.0.0 <8.21.0: ^8.21.0
